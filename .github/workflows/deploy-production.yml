name: Deploy production

# Pushes to main go live, but only behind the same CI gate as a pull request.

on:
  push:
    branches: [main]
  # Lets you re-deploy the current main from the Actions tab without an empty
  # commit — useful after changing an environment variable in Vercel.
  workflow_dispatch:

# Never cancel a production deploy in flight; queue it behind the running one.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test the deployment
        # A green build that 500s on the homepage is not a successful deploy.
        #
        # Tested against the custom domain, not the *.vercel.app URL: this
        # project keeps Vercel Authentication on, so every deployment URL 302s
        # to vercel.com/sso-api and only the custom domain is publicly served.
        env:
          SITE: https://northstackhub.com
        run: |
          set -euo pipefail

          # While the domain still points somewhere other than Vercel, warn
          # rather than fail — that is a DNS state, not a regression in this
          # commit, and it must not wedge every future deploy red.
          if ! curl -sfI --max-time 20 "$SITE/" >/dev/null 2>&1; then
            echo "::warning title=Smoke tests skipped::$SITE is not serving from Vercel yet (DNS still propagating or not pointed at Vercel). Deployment itself succeeded."
            echo "Smoke tests skipped — $SITE not reachable yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          fail=0
          check() { # path expected-description test-expression
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE$1")
            printf 'GET %-12s -> %s\n' "$1" "$code"
            eval "$3" || { echo "  expected $2, got $code"; fail=1; }
          }

          check /         "200"          '[ "$code" = "200" ]'
          check /contact  "200"          '[ "$code" = "200" ]'
          check /packages "200"          '[ "$code" = "200" ]'
          # /pricing moved to /packages when published prices came off. Asserted
          # so the redirect cannot be dropped without this failing.
          check /pricing  "a 3xx redirect" 'case "$code" in 30*) true ;; *) false ;; esac'
          # The console must never render for a signed-out visitor.
          check /aka      "a 3xx redirect" 'case "$code" in 30*) true ;; *) false ;; esac'

          [ "$fail" = "0" ] || { echo "Smoke tests failed"; exit 1; }
          echo "Smoke tests passed against $SITE" >> "$GITHUB_STEP_SUMMARY"
